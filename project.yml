name: AnimalScroller
options:
  bundleIdPrefix: com.cromaximum
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AnimalScroller:
    type: application
    platform: iOS
    sources:
      - AnimalScroller
    info:
      path: AnimalScroller/Info.plist
      properties:
        CFBundleDisplayName: Animal Scroller
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cromaximum.animalscroller
  AnimalScrollerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AnimalScrollerTests
    dependencies:
      - target: AnimalScroller
schemes:
  AnimalScroller:
    build:
      targets:
        AnimalScroller: all
    test:
      targets:
        - AnimalScrollerTests
